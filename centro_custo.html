<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.tailwindcss.com; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com;">
  <title>CNC Gestão - Centro de Custo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 font-sans text-slate-100 min-h-screen p-3 select-none">

  <div class="max-w-md mx-auto bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
    
    <!-- Cabeçalho Centro de Custo -->
    <div class="bg-indigo-800 p-4 text-white flex justify-between items-center">
      <div>
        <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-200 block">Engenharia de Custos Industriais</span>
        <h1 class="text-lg font-bold">Centro de Custo CNC</h1>
      </div>
      <span class="bg-indigo-950/60 text-indigo-200 text-xs px-2 py-1 rounded border border-indigo-400/30">Privado</span>
    </div>

    <!-- Form Parâmetros Centro de Custo -->
    <form id="formCentroCusto" class="p-4 space-y-4" autocomplete="off">

      <!-- Identificação do Centro de Trabalho -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Centro de Trabalho / Máquina *</label>
        <select id="centroTrabalho" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <option value="CC-CNC-01">CC-CNC-01 (Router Nesting 01)</option>
          <option value="CC-CNC-02">CC-CNC-02 (Router Nesting 02)</option>
        </select>
      </div>

      <!-- Taxa Horária de Absorção -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Taxa Horária Absorvida (Depreciação + Energia + M.O.D.) [R$/h] *</label>
        <input type="number" step="0.01" min="0" id="taxaHorariaCC" placeholder="155.00" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        <p class="text-[10px] text-slate-400 mt-1">* Absorção por hora operacional direta do centro de trabalho.</p>
      </div>

      <!-- Custos de Matéria-Prima e Ferramental -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-semibold text-slate-300 mb-1">Custo Matéria-Prima (R$/m² ou R$/kg) *</label>
          <input type="number" step="0.01" min="0" id="custoMaterial" placeholder="45.00" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-slate-300 mb-1">Custo Un. Fresa Corte (R$) *</label>
          <input type="number" step="0.01" min="0" id="custoFresaCC" placeholder="85.00" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
      </div>

      <!-- Taxa de Overhead e Perdas Indiretas do Centro -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-semibold text-slate-300 mb-1">Overhead Indireto CC (%) *</label>
          <input type="number" step="0.1" min="0" max="100" id="overheadCC" placeholder="12.0" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-slate-300 mb-1">Custo Embalagem Un. (R$) *</label>
          <input type="number" step="0.01" min="0" id="custoEmbalagem" placeholder="1.50" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
      </div>

      <!-- Botão de Ação -->
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition duration-150 text-base mt-2">
        Salvar Parâmetros do Centro de Custo
      </button>

    </form>

    <div id="alertaCCSeguro" class="hidden p-4 bg-emerald-950/80 border-t border-emerald-600 text-emerald-200 text-xs">
      <p class="font-bold text-sm">✓ Centro de Custo Atualizado!</p>
      <p class="mt-1 text-emerald-300">As taxas de absorção industrial foram higienizadas e armazenadas com segurança.</p>
    </div>

  </div>

  <script>
    document.getElementById('formCentroCusto').addEventListener('submit', (e) => {
      e.preventDefault();

      const payloadCentroCusto = {
        centroTrabalho: String(document.getElementById('centroTrabalho').value),
        taxaHorariaCC: Number(parseFloat(document.getElementById('taxaHorariaCC').value).toFixed(2)),
        custoMaterial: Number(parseFloat(document.getElementById('custoMaterial').value).toFixed(2)),
        custoFresaCC: Number(parseFloat(document.getElementById('custoFresaCC').value).toFixed(2)),
        overheadCC: Number(parseFloat(document.getElementById('overheadCC').value).toFixed(2)),
        custoEmbalagem: Number(parseFloat(document.getElementById('custoEmbalagem').value).toFixed(2)),
        timestamp: new Date().toISOString()
      };

      sessionStorage.setItem('param_centro_custo_seguro', JSON.stringify(payloadCentroCusto));

      const alerta = document.getElementById('alertaCCSeguro');
      alerta.classList.remove('hidden');
      setTimeout(() => alerta.classList.add('hidden'), 4000);
    });
  </script>

</body>
</html>
